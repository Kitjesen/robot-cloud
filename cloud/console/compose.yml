name: doso-console

services:
  console:
    image: doso/console:4.3.1.8
    restart: unless-stopped
    ports:
      - 127.0.0.1:18081:8080
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - telemetry
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

networks:
  telemetry:
    external: true
    name: doso-telemetry-lab_default
