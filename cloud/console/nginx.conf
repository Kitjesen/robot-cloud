worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # WebSocket credentials may appear in the query string; never log raw requests.
    log_format console '$request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout console;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream thingsboard_backend {
        server thingsboard:8080;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        location ~ ^/(api(?:/|$)|static/(?:rulenode|widgets)(?:/|$)|oauth2(?:/|$)|login/oauth2(?:/|$)) {
            error_log /dev/null crit;
            proxy_pass http://thingsboard_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }

        location = /index.html {
            add_header Cache-Control "no-store" always;
        }

        location ~* \.(?:js|css|png|jpg|jpeg|svg|ico|woff2?|otf|ttf|json|txt)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
