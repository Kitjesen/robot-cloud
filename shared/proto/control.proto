syntax = "proto3";
package doso.remote.v1;

service RemoteControl {
  rpc DeviceLink(stream DeviceEvent) returns (stream DeviceCommand);
  rpc Operate(stream OperatorInput) returns (stream ControlReply);
}

message DeviceEvent {
  oneof event {
    bytes proof = 1;
    ControlReply reply = 2;
  }
}

message DeviceCommand {
  oneof command {
    string challenge = 1;
    bytes grant = 2;
    ControlInput input = 3;
    string close_session = 4;
  }
}

message OperatorInput {
  oneof input {
    bytes grant = 1;
    ControlInput command = 2;
  }
}

enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_CLAIM = 1;
  ACTION_HOLD = 2;
  ACTION_RELEASE = 3;
  ACTION_VELOCITY = 4;
  ACTION_STAND_UP = 5;
  ACTION_SIT_DOWN = 6;
  ACTION_STOP_MOTION = 7;
  ACTION_EMERGENCY_STOP = 8;
  ACTION_CLEAR_EMERGENCY_STOP = 9;
  ACTION_RESUME = 10;
  ACTION_ENABLE_MOTORS = 11;
  ACTION_DISABLE_MOTORS = 12;
  ACTION_SWITCH_PROFILE = 13;
}

message VelocityCommand {
  double vx_m_s = 1;
  double vy_m_s = 2;
  double yaw_rad_s = 3;
  bool deadman = 4;
  bool manual_mode = 5;
  uint64 input_window = 6;
}

message ControlInput {
  string session_id = 1;
  uint64 sequence = 2;
  Action action = 3;
  VelocityCommand velocity = 4;
  string profile_name = 5;
}

message ControlReply {
  string session_id = 1;
  uint64 sequence = 2;
  bool accepted = 3;
  string reason = 4;
  optional bool held_by_client = 5;
  bool final_output_confirmed = 6;
  bool submission_unknown = 7;
  uint64 input_window = 8;
  bool ingress_accepted = 9;
}
