server {
    listen 443 ssl;
    server_name 8.153.169.177;
    ssl_certificate /etc/doso-mqtt/tls/server.pem;
    ssl_certificate_key /etc/doso-mqtt/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1k;

    location /api/v1/robots/ {
        proxy_pass http://127.0.0.1:8130;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 12s;
    }
    location / { return 404; }
}
